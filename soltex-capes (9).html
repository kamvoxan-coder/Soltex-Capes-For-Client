<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soltex Capes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;
  --s1:#0d0d1c;   /* card surface */
  --s2:#111126;   /* slightly lighter surface */
  --b1:#1c1c38;   /* border subtle */
  --b2:#2a2a50;   /* border prominent */
  --ac:#7c3aed;   /* accent purple */
  --ac2:#06b6d4;  /* teal */
  --go:#f59e0b;   /* gold */
  --rd:#ef4444;   /* red */
  --tx:#eeeeff;   /* text */
  --sx:#5a607a;   /* subtext */
  --glow:rgba(124,58,237,.18);
}
html,body{min-height:100%;overflow-x:hidden}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 60px;
  background-image:
    radial-gradient(ellipse 900px 250px at 50% -40px,rgba(124,58,237,.13) 0%,transparent 70%),
    radial-gradient(ellipse 500px 500px at 100% 80%,rgba(6,182,212,.05) 0%,transparent 60%);
}

/* ── TOPBAR ── */
.topbar{
  width:100%;background:rgba(7,7,15,.8);border-bottom:1px solid var(--b1);
  backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:48px;
}
.logo{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;
  background:linear-gradient(90deg,#c084fc,#7c3aed,#06b6d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 10px rgba(167,139,250,.5));}
.topbar-right{display:flex;align-items:center;gap:8px;}
.topbtn{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:7px;border:1px solid var(--b1);
  background:var(--s1);color:var(--sx);font-size:10px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:.3px;
}
.topbtn:hover{border-color:var(--ac2);color:var(--tx);}
.topbtn.prim{background:var(--ac);border-color:var(--ac);color:#fff;
  box-shadow:0 2px 12px rgba(124,58,237,.4);}
.topbtn.prim:hover{background:#6d28d9;box-shadow:0 4px 18px rgba(124,58,237,.6);}
.topbtn.sav{border-color:rgba(124,58,237,.6);color:#a78bfa;}
.topbtn.sav:hover{border-color:var(--ac);background:rgba(124,58,237,.1);}
.topbtn.sav.hidden{display:none;}

/* ── MAIN LAYOUT ── */
.app{display:grid;grid-template-columns:168px 1fr 232px;gap:10px;
  width:100%;max-width:1100px;padding:12px 10px 0;align-items:start;}

/* ── PANEL ── */
.panel{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.panel-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-bottom:1px solid var(--b1);
  background:linear-gradient(90deg,rgba(124,58,237,.06),transparent);
}
.panel-title{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sx);}
.panel-body{padding:10px;}

/* ── TOOL BTNS ── */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.tbtn{
  background:var(--bg);border:1px solid var(--b1);border-radius:8px;
  color:var(--sx);font-size:18px;padding:8px 4px 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:all .12s;font-family:inherit;
}
.tbtn .lbl{font-size:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.tbtn:hover{border-color:var(--ac2);color:var(--tx);transform:translateY(-1px);}
.tbtn.on{border-color:var(--ac);color:#c084fc;background:rgba(124,58,237,.08);
  box-shadow:0 0 12px rgba(124,58,237,.2);}

/* ── COLOR ── */
.color-section{padding:10px;border-bottom:1px solid var(--b1);}
.crow{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
#dot{width:30px;height:30px;border-radius:7px;border:2px solid var(--b2);cursor:pointer;
  flex-shrink:0;transition:all .12s;box-shadow:0 2px 8px rgba(0,0,0,.4);}
#dot:hover{transform:scale(1.08);box-shadow:0 4px 14px rgba(0,0,0,.6);}
#hexIn{flex:1;background:var(--bg);border:1px solid var(--b1);border-radius:6px;
  color:var(--tx);font-size:10px;font-family:monospace;padding:5px 7px;width:0;
  outline:none;letter-spacing:1px;transition:border-color .15s;}
#hexIn:focus{border-color:var(--ac);}
.pal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.pc{aspect-ratio:1;border-radius:4px;cursor:pointer;border:1.5px solid transparent;
  transition:transform .1s,box-shadow .1s;}
.pc:hover{transform:scale(1.2);z-index:5;position:relative;box-shadow:0 0 6px rgba(255,255,255,.2);}
.pc.on{border-color:#fff;transform:scale(1.1);}

/* ── ACTION BTNS ── */
.acts{display:flex;flex-direction:column;gap:4px;padding:10px;}
.abtn{
  background:var(--bg);border:1px solid var(--b1);border-radius:7px;color:var(--sx);
  font-size:10px;font-weight:600;padding:7px 9px;cursor:pointer;font-family:inherit;
  transition:all .12s;display:flex;align-items:center;gap:6px;
}
.abtn:hover{border-color:var(--ac2);color:var(--tx);}
.abtn.danger:hover{border-color:var(--rd);color:var(--rd);}
.abtn .ak{margin-left:auto;font-size:8px;font-family:monospace;color:var(--b2);}

/* KEYS */
.keys{padding:10px;border-top:1px solid var(--b1);}
.keys-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;}
.key-row{display:flex;align-items:center;gap:4px;font-size:8px;color:var(--sx);}
kbd{background:var(--s2);border:1px solid var(--b2);border-radius:3px;
  padding:1px 5px;font-size:8px;font-family:monospace;color:var(--go);}

/* ── CENTER ── */
.center{display:flex;flex-direction:column;align-items:center;gap:8px;}
.cwrap{
  background:repeating-conic-gradient(#141428 0% 25%,#0d0d1a 0% 50%) 0 0/14px 14px;
  border:1px solid var(--b1);border-radius:12px;overflow:hidden;cursor:crosshair;
  position:relative;box-shadow:0 0 0 1px rgba(124,58,237,.1),0 8px 40px rgba(0,0,0,.5);
}
#cc,#go{display:block;image-rendering:pixelated;}
#go{position:absolute;top:0;left:0;pointer-events:none;}

.cfoot{display:flex;align-items:center;gap:10px;width:100%;}
.zrow{display:flex;align-items:center;gap:4px;}
.zbtn{
  background:var(--s1);border:1px solid var(--b1);border-radius:5px;color:var(--tx);
  width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-family:inherit;transition:border-color .12s;
}
.zbtn:hover{border-color:var(--ac);}
#zl{font-size:10px;font-weight:700;min-width:28px;text-align:center;color:#a78bfa;}
#ctip{font-size:9px;font-family:monospace;color:var(--sx);flex:1;text-align:center;}
.alive-badge{
  display:none;font-size:8px;padding:3px 9px;border-radius:20px;
  background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.4);color:#c084fc;
  font-weight:700;cursor:pointer;align-items:center;gap:5px;letter-spacing:.5px;
}
.alive-badge.on{display:inline-flex;}
.alive-badge::before{content:'';width:6px;height:6px;border-radius:50%;
  background:#a78bfa;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}

/* ── TEMPLATES PANEL ── */
.tpl-panel{background:var(--s1);border:1px solid var(--b1);border-radius:12px;width:100%;overflow:hidden;}
.tpl-tabs{display:flex;border-bottom:1px solid var(--b1);}
.ttab{flex:1;padding:7px 6px;font-size:8px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--sx);cursor:pointer;text-align:center;
  transition:all .12s;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;}
.ttab:hover{color:var(--tx);}
.ttab.on{color:#a78bfa;border-bottom-color:var(--ac);background:rgba(124,58,237,.05);}
.tpl-body{padding:8px;display:none;}
.tpl-body.on{display:block;}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.tmpl{background:var(--bg);border:1px solid var(--b1);border-radius:7px;color:var(--sx);
  font-size:7px;font-weight:700;padding:5px 2px 4px;cursor:pointer;text-align:center;
  transition:all .12s;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  gap:3px;text-transform:uppercase;letter-spacing:.3px;}
.tmpl .tpv{width:30px;height:20px;border-radius:3px;overflow:hidden;border:1px solid var(--b1);}
.tmpl .tpv canvas{display:block;image-rendering:pixelated;}
.tmpl:hover{border-color:var(--ac);color:#c084fc;}
.tmpl.on{border-color:#8b5cf6;color:#c084fc;box-shadow:0 0 10px rgba(139,92,246,.25);}

/* CUSTOM TEMPLATES */
.custom-tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.ctmpl{background:var(--bg);border:1px solid var(--b1);border-radius:7px;color:var(--sx);
  font-size:7px;font-weight:700;padding:5px 3px 4px;cursor:pointer;text-align:center;
  transition:all .12s;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  gap:3px;text-transform:uppercase;letter-spacing:.3px;position:relative;}
.ctmpl:hover{border-color:var(--go);color:var(--go);}
.ctmpl.on{border-color:var(--go);color:var(--go);box-shadow:0 0 10px rgba(245,158,11,.2);}
.ctmpl .tpv{width:30px;height:20px;border-radius:3px;overflow:hidden;border:1px solid var(--b1);}
.ctmpl .tpv canvas{display:block;image-rendering:pixelated;}
.ctmpl-del{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;
  background:var(--rd);color:#fff;font-size:9px;display:none;align-items:center;
  justify-content:center;cursor:pointer;font-weight:900;line-height:1;}
.ctmpl:hover .ctmpl-del{display:flex;}
.ctmpl-edit{position:absolute;top:-5px;left:-5px;width:14px;height:14px;border-radius:50%;
  background:var(--ac2);color:#fff;font-size:8px;display:none;align-items:center;
  justify-content:center;cursor:pointer;font-weight:900;line-height:1;}
.ctmpl:hover .ctmpl-edit{display:flex;}
.empty-custom{text-align:center;padding:16px 8px;color:var(--sx);font-size:9px;line-height:1.8;}

/* ── TIMELINE ── */
.timeline-card{width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.tl-top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--b1);}
.tl-left{display:flex;align-items:center;gap:8px;}
.tl-title{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sx);}
.tl-play{
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;
  border:1px solid var(--ac);color:#a78bfa;background:rgba(124,58,237,.08);
  font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;
}
.tl-play:hover,.tl-play.on{background:rgba(124,58,237,.18);color:#c084fc;}
.tl-step{
  width:26px;height:26px;border-radius:5px;border:1px solid var(--b1);
  background:var(--bg);color:var(--sx);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .12s;
}
.tl-step:hover{border-color:var(--ac2);color:var(--tx);}
.tl-right{display:flex;align-items:center;gap:8px;}
.fps-row{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--sx);}
.fps-row input{width:36px;background:var(--bg);border:1px solid var(--b1);border-radius:4px;
  color:var(--tx);font-size:10px;text-align:center;padding:2px 4px;outline:none;font-family:monospace;}
.fps-row input:focus{border-color:var(--ac);}
#framectr{font-size:9px;color:var(--sx);font-weight:700;min-width:36px;text-align:right;}

.frame-strip-wrap{overflow-x:auto;padding:8px 10px 6px;}
.frame-strip{display:flex;gap:6px;align-items:center;min-height:58px;}
.fthumb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;}
.fthumb canvas{border-radius:5px;border:2px solid var(--b2);image-rendering:pixelated;transition:all .12s;}
.fthumb.active canvas{border-color:var(--ac);box-shadow:0 0 10px rgba(124,58,237,.5);}
.fthumb:hover canvas{border-color:var(--ac2);}
.fnum{font-size:7px;color:var(--sx);font-weight:700;}
.fthumb.active .fnum{color:#a78bfa;}
.fdel{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;
  background:var(--rd);color:#fff;font-size:9px;display:none;align-items:center;
  justify-content:center;cursor:pointer;font-weight:900;}
.fthumb:hover .fdel{display:flex;}
.fadd,.fdup{
  flex-shrink:0;width:42px;height:42px;border-radius:7px;border:1.5px dashed var(--b2);
  background:transparent;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:all .15s;font-family:inherit;
}
.fadd{font-size:20px;color:var(--sx);}
.fadd:hover{border-color:var(--ac);color:#a78bfa;background:rgba(124,58,237,.06);}
.fdup{font-size:11px;color:var(--sx);}
.fdup:hover{border-color:var(--ac2);color:var(--ac2);background:rgba(6,182,212,.06);}
.fdup-lbl{font-size:7px;font-weight:700;letter-spacing:.3px;}

/* ── RIGHT ── */
.right{display:flex;flex-direction:column;gap:8px;}
.preview-card{
  background:linear-gradient(160deg,#05050e 0%,#0b0318 60%,#050510 100%);
  border:1px solid var(--b1);border-radius:12px;overflow:hidden;
}
.pv-top{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 0;}
.pv-label{font-size:8px;letter-spacing:2px;color:var(--sx);text-transform:uppercase;font-weight:700;}
.pv-fps{font-size:8px;color:#a78bfa;font-weight:700;}
#steveCanvas{display:block;}

/* SKIN PANEL */
.skin-panel-wrap{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.skin-tabs{display:flex;border-bottom:1px solid var(--b1);}
.stab{flex:1;padding:7px 4px;font-size:8px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--sx);cursor:pointer;text-align:center;
  border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;transition:all .12s;}
.stab:hover{color:var(--tx);}
.stab.on{color:#a78bfa;border-bottom-color:var(--ac);}
.skin-body{padding:9px;display:none;}
.skin-body.on{display:block;}
.skin-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.skin-row label{font-size:9px;color:var(--sx);font-weight:600;width:44px;flex-shrink:0;}
.skin-swatch{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--b1);
  cursor:pointer;flex-shrink:0;transition:transform .1s;}
.skin-swatch:hover{transform:scale(1.1);}
.skin-hex{flex:1;background:var(--bg);border:1px solid var(--b1);border-radius:5px;
  color:var(--tx);font-size:9px;font-family:monospace;padding:3px 6px;outline:none;width:0;}
.skin-hex:focus{border-color:var(--ac);}
.presets-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.preset-btn{background:var(--bg);border:1px solid var(--b1);border-radius:6px;
  color:var(--sx);font-size:9px;font-weight:600;padding:6px 4px;cursor:pointer;
  font-family:inherit;transition:all .12s;text-align:center;}
.preset-btn:hover{border-color:var(--go);color:var(--go);}

/* EXPORT */
.export-card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.export-body{padding:9px;display:flex;flex-direction:column;gap:5px;}
.dl-btn{
  width:100%;padding:9px;border-radius:8px;border:none;cursor:pointer;
  font-family:'Press Start 2P',monospace;font-size:6px;letter-spacing:1px;line-height:2;
  transition:all .15s;
}
.dl-btn.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;
  box-shadow:0 3px 14px rgba(124,58,237,.4);}
.dl-btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(124,58,237,.6);}
.dl-btn.secondary{background:var(--bg);border:1px solid var(--b1);color:var(--sx);}
.dl-btn.secondary:hover{border-color:var(--ac2);color:var(--ac2);}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-bg.on{display:flex;}
.modal{
  background:var(--s1);border:1px solid var(--b2);border-radius:14px;
  padding:22px;width:320px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 1px rgba(124,58,237,.2);
  animation:modalIn .18s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-size:13px;font-weight:700;color:var(--tx);}
.modal-sub{font-size:10px;color:var(--sx);line-height:1.6;}
.modal-input{
  background:var(--bg);border:1px solid var(--b2);border-radius:8px;
  color:var(--tx);font-size:13px;padding:9px 12px;outline:none;
  font-family:inherit;width:100%;transition:border-color .15s;
}
.modal-input:focus{border-color:var(--ac);}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{
  flex:1;padding:9px;border-radius:8px;font-family:inherit;
  font-size:11px;font-weight:700;cursor:pointer;transition:all .12s;border:1px solid var(--b1);
}
.btn-confirm{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border-color:transparent;}
.btn-confirm:hover{box-shadow:0 4px 16px rgba(124,58,237,.5);}
.btn-cancel{background:var(--bg);color:var(--sx);}
.btn-cancel:hover{border-color:var(--ac2);color:var(--tx);}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">⚡ SOLTEX CAPES</div>
  <div class="topbar-right">
    <button class="topbtn sav hidden" id="saveTemplateBtn" onclick="openSaveModal()">💾 Save Template</button>
    <button class="topbtn" onclick="newTemplate()">＋ New Template</button>
    <button class="topbtn" onclick="saveCurrent()">⬇ Frame</button>
    <button class="topbtn prim" onclick="saveAllFrames()">⬇ All Frames</button>
  </div>
</div>

<div class="app">

<!-- ══ LEFT ══ -->
<div class="left" style="display:flex;flex-direction:column;gap:8px;">

  <!-- TOOLS -->
  <div class="panel">
    <div class="panel-hd"><span class="panel-title">Tools</span></div>
    <div class="panel-body">
      <div class="tools">
        <button class="tbtn on" data-t="draw" onclick="setTool(this)">✏️<span class="lbl">Draw</span></button>
        <button class="tbtn" data-t="erase" onclick="setTool(this)">🧹<span class="lbl">Erase</span></button>
        <button class="tbtn" data-t="fill" onclick="setTool(this)">🪣<span class="lbl">Fill</span></button>
        <button class="tbtn" data-t="pick" onclick="setTool(this)">💉<span class="lbl">Pick</span></button>
      </div>
    </div>
  </div>

  <!-- COLOR -->
  <div class="panel">
    <div class="panel-hd"><span class="panel-title">Color</span></div>
    <div class="color-section">
      <div class="crow">
        <div id="dot" onclick="document.getElementById('cpick').click()"></div>
        <input id="hexIn" type="text" value="#8B5CF6" maxlength="7" oninput="onHex(this)">
        <input id="cpick" type="color" value="#8b5cf6" oninput="onPick(this)" style="display:none">
      </div>
      <div class="pal" id="pal"></div>
    </div>
  </div>

  <!-- EDIT -->
  <div class="panel">
    <div class="panel-hd"><span class="panel-title">Edit</span></div>
    <div class="acts">
      <button class="abtn" onclick="undo()">↩ Undo<span class="ak">⌘Z</span></button>
      <button class="abtn" onclick="redo()">↪ Redo<span class="ak">⌘Y</span></button>
      <button class="abtn" onclick="mirH()">⟺ Mirror H</button>
      <button class="abtn" onclick="mirV()">↕ Mirror V</button>
      <button class="abtn danger" onclick="doClear()">🗑 Clear Frame</button>
    </div>
    <div class="keys">
      <div class="keys-grid">
        <div class="key-row"><kbd>B</kbd> Draw</div>
        <div class="key-row"><kbd>E</kbd> Erase</div>
        <div class="key-row"><kbd>F</kbd> Fill</div>
        <div class="key-row"><kbd>I</kbd> Pick</div>
        <div class="key-row"><kbd>Space</kbd> Play</div>
        <div class="key-row"><kbd>← →</kbd> Frame</div>

<div class="center">

    onmousedown="mdown(event)" onmousemove="mmove(event)" onmouseup="mup()" onmouseleave="mup()"

  <!-- TIMELINE -->

      <div class="skin-row"><label>Shirt</label><div class="skin-swatch" id="sw-shirt" onclick="pickSkin('shirt')"></div><input class="skin-hex" id="sh-shirt" value="#1A6BBF" oninput="skinHex('shirt',this)"></div>
      <div class="skin-row"><label>Pants</label><div class="skin-swatch" id="sw-pants" onclick="pickSkin('pants')"></div><input class="skin-hex" id="sh-pants" value="#3B2A1E" oninput="skinHex('pants',this)"></div>
      <div class="skin-row"><label>Shoes</label><div class="skin-swatch" id="sw-shoes" onclick="pickSkin('shoes')"></div><input class="skin-hex" id="sh-shoes" value="#1A0A04" oninput="skinHex('shoes',this)"></div>
      <input type="color" id="skinPicker" style="display:none" oninput="onSkinPicker(this)">

  <!-- EXPORT -->

<!-- SAVE TEMPLATE MODAL -->

    <input class="modal-input" id="tplNameInput" placeholder="Template name…" maxlength="28">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmSave()">Save Template</button>
    </div>

<!-- RENAME MODAL -->

  <div class="modal">
    <div class="modal-title">✏️ Rename Template</div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRenameModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmRename()">Rename</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CORE STATE
// ═══════════════════════════════════════════════
const CW=64,CH=32;
const PAL=['#ffffff','#e5e5e5','#aaaaaa','#666666','#333333','#000000','#ff0000','#cc0000','#ff6600','#ff9900','#ffcc00','#ffff00','#88ff00','#00ff44','#00cc44','#006622','#00ffcc','#00ccff','#0088ff','#0044cc','#3300cc','#6600cc','#9900ff','#cc00ff','#ff00cc','#ff0066','#ff4488','#ff6b6b','#ffd700','#f59e0b','#cd853f','#8b4513','#7c3aed','#06b6d4','#10b981','#f43f5e','#1e1e3a','#0d0d1a','#080810','#3b0764'];

let zoom=12, tool='draw', color='#8b5cf6';
let gf=0;

// Frames
let frames=[new Uint8ClampedArray(CW*CH*4)];
let curFrame=0;
let playing=false, fps=8;
let fHist=[[new Uint8ClampedArray(CW*CH*4)]], fHi=[0];
function cpx(){return frames[curFrame];}

let painting=false, lx=-1, ly=-1;
let animFn=null;

// Custom templates: {id, name, pixels}
let customTpls=[];
let editingTplId=null; // if set, we are re-editing an existing custom tpl
let activeSkinKey=null;
let renamingId=null;

// Skin
let skin={skin:'#f5c68e',hair:'#3d2000',shirt:'#1a6bbf',pants:'#3b2a1e',shoes:'#1a0a04'};

// ═══════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════
const cc=document.getElementById('cc'),ctx=cc.getContext('2d');
const go=document.getElementById('go'),gctx=go.getContext('2d');
const sc=document.getElementById('steveCanvas'),scx=sc.getContext('2d');
const SW=220,SH=298;

function resize(){
  cc.width=go.width=CW*zoom;cc.height=go.height=CH*zoom;
  drawGrid();render2d();
}
function drawGrid(){
  gctx.clearRect(0,0,go.width,go.height);
  gctx.strokeStyle='rgba(255,255,255,0.03)';gctx.lineWidth=1;
  for(let x=0;x<=CW;x++){gctx.beginPath();gctx.moveTo(x*zoom,0);gctx.lineTo(x*zoom,go.height);gctx.stroke();}
  for(let y=0;y<=CH;y++){gctx.beginPath();gctx.moveTo(0,y*zoom);gctx.lineTo(go.width,y*zoom);gctx.stroke();}
  gctx.strokeStyle='rgba(124,58,237,.7)';gctx.lineWidth=2;
  gctx.strokeRect(zoom,zoom,10*zoom,16*zoom);
}
function render2d(){
  const id=new ImageData(CW,CH);id.data.set(cpx());
  const t=document.createElement('canvas');t.width=CW;t.height=CH;
  t.getContext('2d').putImageData(id,0,0);
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cc.width,cc.height);
  ctx.drawImage(t,0,0,cc.width,cc.height);
}

// ═══════════════════════════════════════════════
// PIXEL OPS
// ═══════════════════════════════════════════════
function idx(x,y){return(y*CW+x)*4;}
function sp(x,y,r,g,b,a=255,buf){if(x<0||x>=CW||y<0||y>=CH)return;buf=buf||cpx();const i=idx(x,y);buf[i]=r;buf[i+1]=g;buf[i+2]=b;buf[i+3]=a;}
function gp(x,y,buf){if(x<0||x>=CW||y<0||y>=CH)return[0,0,0,0];buf=buf||cpx();const i=idx(x,y);return[buf[i],buf[i+1],buf[i+2],buf[i+3]];}
function h2r(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}

// ═══════════════════════════════════════════════
// DRAWING
// ═══════════════════════════════════════════════
function coords(e,touch=false){
  const rect=cc.getBoundingClientRect(),sx=cc.width/rect.width,sy2=cc.height/rect.height;
  let cx,cy;
  if(touch){const t=e.touches[0]||e.changedTouches[0];cx=(t.clientX-rect.left)*sx;cy=(t.clientY-rect.top)*sy2;}
  else{cx=(e.clientX-rect.left)*sx;cy=(e.clientY-rect.top)*sy2;}
  return[Math.floor(cx/zoom),Math.floor(cy/zoom)];
}
function paintPx(x,y){
  if(tool==='erase'){sp(x,y,0,0,0,0);return;}
  const[r,g,b]=h2r(color);sp(x,y,r,g,b);
}
function bline(x0,y0,x1,y1,fn){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy;while(true){fn(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}}
function flood(sx2,sy2){const[tr,tg,tb,ta]=gp(sx2,sy2);const[fr,fg,fb]=h2r(color);if(tr===fr&&tg===fg&&tb===fb&&ta===255)return;const stack=[[sx2,sy2]],vis=new Set();while(stack.length){const[x,y]=stack.pop();if(x<0||x>=CW||y<0||y>=CH)continue;const k=y*CW+x;if(vis.has(k))continue;vis.add(k);const[r,g,b,a]=gp(x,y);if(r!==tr||g!==tg||b!==tb||a!==ta)continue;sp(x,y,fr,fg,fb);stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}}
function mdown(e,touch=0){if(touch)e.preventDefault();pushHist();painting=true;const[x,y]=coords(e,touch);if(tool==='pick'){const[r,g,b,a]=gp(x,y);if(a>0)setColor(r2h(r,g,b));painting=false;return;}if(tool==='fill'){flood(x,y);render2d();updateThumb(curFrame);painting=false;return;}lx=x;ly=y;paintPx(x,y);render2d();updateThumb(curFrame);}
function mmove(e,touch=0){if(touch)e.preventDefault();const[x,y]=coords(e,touch);document.getElementById('ctip').textContent='X:'+x+' Y:'+y;if(!painting||tool==='fill'||tool==='pick')return;if(x===lx&&y===ly)return;bline(lx,ly,x,y,(a,b)=>paintPx(a,b));lx=x;ly=y;render2d();updateThumb(curFrame);}
function mup(){painting=false;lx=ly=-1;}

// ═══════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════
function pushHist(){fHist[curFrame]=fHist[curFrame].slice(0,fHi[curFrame]+1);fHist[curFrame].push(new Uint8ClampedArray(cpx()));if(fHist[curFrame].length>40)fHist[curFrame].shift();fHi[curFrame]=fHist[curFrame].length-1;}
function undo(){if(fHi[curFrame]<=0)return;fHi[curFrame]--;frames[curFrame]=new Uint8ClampedArray(fHist[curFrame][fHi[curFrame]]);render2d();updateThumb(curFrame);}
function redo(){if(fHi[curFrame]>=fHist[curFrame].length-1)return;fHi[curFrame]++;frames[curFrame]=new Uint8ClampedArray(fHist[curFrame][fHi[curFrame]]);render2d();updateThumb(curFrame);}

// ═══════════════════════════════════════════════
// FRAMES
// ═══════════════════════════════════════════════
function switchFrame(i){curFrame=i;render2d();refreshStrip();document.getElementById('framectr').textContent=(i+1)+' / '+frames.length;}
function addFrame(){frames.push(new Uint8ClampedArray(CW*CH*4));fHist.push([new Uint8ClampedArray(CW*CH*4)]);fHi.push(0);switchFrame(frames.length-1);buildStrip();}
function dupFrame(){const c=new Uint8ClampedArray(cpx());frames.splice(curFrame+1,0,c);fHist.splice(curFrame+1,0,[new Uint8ClampedArray(c)]);fHi.splice(curFrame+1,0,0);switchFrame(curFrame+1);buildStrip();}
function deleteFrame(i){if(frames.length<=1){doClear();return;}frames.splice(i,1);fHist.splice(i,1);fHi.splice(i,1);switchFrame(Math.min(i,frames.length-1));buildStrip();}
function prevFrame(){switchFrame((curFrame-1+frames.length)%frames.length);}
function nextFrame(){switchFrame((curFrame+1)%frames.length);}

// ═══════════════════════════════════════════════
// PLAYBACK
// ═══════════════════════════════════════════════
function togglePlay(){playing=!playing;const btn=document.getElementById('playBtn');btn.textContent=playing?'⏸ Pause':'▶ Play';btn.classList.toggle('on',playing);document.getElementById('pvFps').textContent=playing?fps+' fps':'';}
function setFps(v){fps=Math.max(1,Math.min(30,v||8));}

// ═══════════════════════════════════════════════
// TIMELINE UI
// ═══════════════════════════════════════════════
function buildStrip(){
  const strip=document.getElementById('frameStrip');
  strip.querySelectorAll('.fthumb').forEach(e=>e.remove());
  const addBtn=strip.querySelector('.fadd');
  frames.forEach((_,i)=>{
    const wrap=document.createElement('div');wrap.className='fthumb'+(i===curFrame?' active':'');wrap.dataset.i=i;
    const del=document.createElement('div');del.className='fdel';del.textContent='×';del.onclick=e=>{e.stopPropagation();deleteFrame(i);};
    const c=document.createElement('canvas');c.width=CW;c.height=CH;c.style.width='42px';c.style.height='21px';
    renderThumbTo(c,i);
    const num=document.createElement('div');num.className='fnum';num.textContent='#'+(i+1);
    wrap.appendChild(del);wrap.appendChild(c);wrap.appendChild(num);
    wrap.onclick=()=>switchFrame(i);
    strip.insertBefore(wrap,addBtn);
  });
  document.getElementById('framectr').textContent=(curFrame+1)+' / '+frames.length;
}
function refreshStrip(){document.querySelectorAll('.fthumb').forEach(el=>{const i=parseInt(el.dataset.i);el.classList.toggle('active',i===curFrame);});}
function updateThumb(i){const el=document.querySelector('.fthumb[data-i="'+i+'"] canvas');if(el)renderThumbTo(el,i);}
function renderThumbTo(canvas,i){canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(frames[i]),CW,CH),0,0);}

// ═══════════════════════════════════════════════
// TOOLS / ZOOM / COLOR
// ═══════════════════════════════════════════════
function setTool(btn){tool=btn.dataset.t;document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function chZoom(d){const zs=[6,8,10,12,14,16,20];let i=zs.indexOf(zoom)+d;i=Math.max(0,Math.min(zs.length-1,i));zoom=zs[i];document.getElementById('zl').textContent=zoom+'×';resize();}
function setColor(hex){color=hex;document.getElementById('dot').style.background=hex;document.getElementById('hexIn').value=hex.toUpperCase();document.getElementById('cpick').value=hex;}
function onHex(el){let v=el.value;if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v))setColor(v);}
function onPick(el){setColor(el.value);}
function buildPal(){const g=document.getElementById('pal');PAL.forEach(h=>{const d=document.createElement('div');d.className='pc';d.style.background=h;d.onclick=()=>{document.querySelectorAll('.pc').forEach(x=>x.classList.remove('on'));d.classList.add('on');setColor(h);};g.appendChild(d);});}
function mirH(){pushHist();for(let y=0;y<CH;y++)for(let x=0;x<CW/2;x++){const i1=idx(x,y),i2=idx(CW-1-x,y);for(let c=0;c<4;c++){const t=cpx()[i1+c];cpx()[i1+c]=cpx()[i2+c];cpx()[i2+c]=t;}}render2d();updateThumb(curFrame);}
function mirV(){pushHist();for(let y=0;y<CH/2;y++)for(let x=0;x<CW;x++){const i1=idx(x,y),i2=idx(x,CH-1-y);for(let c=0;c<4;c++){const t=cpx()[i1+c];cpx()[i1+c]=cpx()[i2+c];cpx()[i2+c]=t;}}render2d();updateThumb(curFrame);}
function doClear(){if(!confirm('Clear this frame?'))return;stopAnim();pushHist();frames[curFrame]=new Uint8ClampedArray(CW*CH*4);render2d();updateThumb(curFrame);}

// ═══════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════
function saveCurrent(){const t=document.createElement('canvas');t.width=CW;t.height=CH;t.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(cpx()),CW,CH),0,0);const a=document.createElement('a');a.download='soltex-frame'+(curFrame+1)+'.png';a.href=t.toDataURL('image/png');a.click();}
async function saveAllFrames(){for(let i=0;i<frames.length;i++){const t=document.createElement('canvas');t.width=CW;t.height=CH;t.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(frames[i]),CW,CH),0,0);const a=document.createElement('a');a.download='soltex-frame'+(i+1)+'.png';a.href=t.toDataURL('image/png');a.click();await new Promise(r=>setTimeout(r,100));}}

// ═══════════════════════════════════════════════
// SKIN
// ═══════════════════════════════════════════════
const PRESETS=[
  {name:'Steve',skin:'#f5c68e',hair:'#3d2000',shirt:'#1a6bbf',pants:'#3b2a1e',shoes:'#1a0a04'},
  {name:'Dark',skin:'#8b5c2a',hair:'#1a0800',shirt:'#1a1a6b',pants:'#1a1a1a',shoes:'#0a0a0a'},
  {name:'Zombie',skin:'#5a8c5a',hair:'#2a5a2a',shirt:'#3a5a3a',pants:'#2a3a2a',shoes:'#1a2a1a'},
  {name:'Skeleton',skin:'#e8e8e8',hair:'#c0c0c0',shirt:'#d0d0d0',pants:'#a0a0a0',shoes:'#808080'},
  {name:'Creeper',skin:'#3a8c3a',hair:'#2a5a2a',shirt:'#2a7a2a',pants:'#1a5a1a',shoes:'#0a3a0a'},
  {name:'Enderman',skin:'#1a1a2e',hair:'#0a0a1a',shirt:'#0f0f20',pants:'#0a0a18',shoes:'#050510'},
  {name:'Blaze',skin:'#f5c832',hair:'#c8a020',shirt:'#f0a010',pants:'#c87800',shoes:'#a05000'},
  {name:'Snow',skin:'#f0f4ff',hair:'#b0c8e8',shirt:'#d0e8ff',pants:'#8090b0',shoes:'#506080'},
];
function buildPresets(){const g=document.getElementById('presetsGrid');PRESETS.forEach(p=>{const b=document.createElement('button');b.className='preset-btn';b.textContent=p.name;b.onclick=()=>{Object.assign(skin,p);refreshSkinUI();};g.appendChild(b);});}
function refreshSkinUI(){Object.keys(skin).forEach(k=>{const sw=document.getElementById('sw-'+k),sh=document.getElementById('sh-'+k);if(sw)sw.style.background=skin[k];if(sh)sh.value=skin[k].toUpperCase();});}
function pickSkin(key){activeSkinKey=key;const p=document.getElementById('skinPicker');p.value=skin[key];p.click();}
function onSkinPicker(el){if(!activeSkinKey)return;skin[activeSkinKey]=el.value;refreshSkinUI();}
function skinHex(key,el){let v=el.value;if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v)){skin[key]=v;document.getElementById('sw-'+key).style.background=v;}}
function skinTab(name,btn){document.querySelectorAll('.stab').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.skin-body').forEach(p=>p.classList.remove('on'));btn.classList.add('on');document.getElementById('stab-'+name).classList.add('on');}

// ═══════════════════════════════════════════════
// TEMPLATE TABS
// ═══════════════════════════════════════════════
function tplTab(name,btn){
  document.querySelectorAll('.ttab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tpl-body').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tplbody-'+name).classList.add('on');
}

// ═══════════════════════════════════════════════
// CUSTOM TEMPLATES
// ═══════════════════════════════════════════════
function newTemplate(){
  if(!confirm('Clear the canvas to start a new template?'))return;
  stopAnim();
  pushHist();
  frames[curFrame]=new Uint8ClampedArray(CW*CH*4);
  render2d();updateThumb(curFrame);
  editingTplId=null; // new, not editing existing
  document.getElementById('saveTemplateBtn').classList.remove('hidden');
  // Switch to custom tab so they know where it will go
  const customBtn=document.querySelector('.ttab:nth-child(2)');
  if(customBtn)tplTab('custom',customBtn);
}

function openSaveModal(){
  document.getElementById('tplNameInput').value='';
  document.getElementById('saveModal').classList.add('on');
  setTimeout(()=>document.getElementById('tplNameInput').focus(),60);
}
function closeModal(){document.getElementById('saveModal').classList.remove('on');}

function confirmSave(){
  const name=document.getElementById('tplNameInput').value.trim()||'My Template';
  closeModal();
  const snapshot=new Uint8ClampedArray(cpx());

  if(editingTplId){
    // Update existing
    const tpl=customTpls.find(t=>t.id===editingTplId);
    if(tpl){tpl.pixels=snapshot;tpl.name=name;}
    editingTplId=null;
  } else {
    // Create new
    customTpls.push({id:'ct_'+Date.now(),name,pixels:snapshot});
  }
  document.getElementById('saveTemplateBtn').classList.add('hidden');
  buildCustomGrid();
  // Switch to custom tab
  const customBtn=document.querySelector('.ttab:nth-child(2)');
  if(customBtn)tplTab('custom',customBtn);
}

function applyCustomTpl(id){
  const tpl=customTpls.find(t=>t.id===id);
  if(!tpl)return;
  stopAnim();pushHist();
  frames[curFrame]=new Uint8ClampedArray(tpl.pixels);
  render2d();updateThumb(curFrame);
  document.querySelectorAll('.ctmpl').forEach(b=>b.classList.remove('on'));
  document.getElementById('ct_'+id)&&document.getElementById('ct_'+id).classList.add('on');
}

function editCustomTpl(id){
  const tpl=customTpls.find(t=>t.id===id);
  if(!tpl)return;
  // Load it into the canvas for editing
  pushHist();
  frames[curFrame]=new Uint8ClampedArray(tpl.pixels);
  render2d();updateThumb(curFrame);
  editingTplId=id;
  document.getElementById('saveTemplateBtn').classList.remove('hidden');
}

function deleteCustomTpl(id){
  if(!confirm('Delete this template?'))return;
  customTpls=customTpls.filter(t=>t.id!==id);
  buildCustomGrid();
}

function openRenameModal(id){
  renamingId=id;
  const tpl=customTpls.find(t=>t.id===id);
  document.getElementById('renameInput').value=tpl?tpl.name:'';
  document.getElementById('renameModal').classList.add('on');
  setTimeout(()=>document.getElementById('renameInput').focus(),60);
}
function closeRenameModal(){document.getElementById('renameModal').classList.remove('on');renamingId=null;}
function confirmRename(){const name=document.getElementById('renameInput').value.trim();if(!name)return;const tpl=customTpls.find(t=>t.id===renamingId);if(tpl)tpl.name=name;closeRenameModal();buildCustomGrid();}

function buildCustomGrid(){
  const grid=document.getElementById('customGrid');
  const count=customTpls.length;
  // Update tab badge
  document.getElementById('customCount').textContent=count?'('+count+')':'';

  if(count===0){
    grid.innerHTML='<div class="empty-custom">No saved templates yet.<br>Click <strong>＋ New Template</strong> to draw one,<br>then <strong>💾 Save Template</strong> to keep it.</div>';
    return;
  }

  grid.innerHTML='';
  const g=document.createElement('div');g.className='custom-tgrid';

  customTpls.forEach(tpl=>{
    const btn=document.createElement('div');btn.className='ctmpl';btn.id='ct_'+tpl.id;

    // Preview canvas
    const pvDiv=document.createElement('div');pvDiv.className='tpv';
    const pvc=document.createElement('canvas');pvc.width=10;pvc.height=16;
    const tmp=new Uint8ClampedArray(10*16*4);
    for(let y=0;y<16;y++)for(let x=0;x<10;x++){const src=((y+1)*CW+(x+1))*4,dst=(y*10+x)*4;tmp[dst]=tpl.pixels[src];tmp[dst+1]=tpl.pixels[src+1];tmp[dst+2]=tpl.pixels[src+2];tmp[dst+3]=255;}
    pvc.getContext('2d').putImageData(new ImageData(tmp,10,16),0,0);
    pvDiv.appendChild(pvc);

    const nm=document.createElement('div');nm.style.cssText='font-size:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:48px;';nm.title=tpl.name;nm.textContent=tpl.name;

    // Buttons
    const del=document.createElement('div');del.className='ctmpl-del';del.title='Delete';del.textContent='×';del.onclick=e=>{e.stopPropagation();deleteCustomTpl(tpl.id);};
    const edit=document.createElement('div');edit.className='ctmpl-edit';edit.title='Edit';edit.textContent='✎';edit.onclick=e=>{e.stopPropagation();editCustomTpl(tpl.id);};

    btn.appendChild(del);btn.appendChild(edit);btn.appendChild(pvDiv);btn.appendChild(nm);
    btn.onclick=()=>applyCustomTpl(tpl.id);
    btn.ondblclick=()=>openRenameModal(tpl.id);

    g.appendChild(btn);
  });

  // Context: also add a small "New" chip
  const newChip=document.createElement('button');
  newChip.style.cssText='background:var(--bg);border:1.5px dashed var(--b2);border-radius:7px;color:var(--sx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;height:60px;transition:all .15s;';
  newChip.title='New template';newChip.textContent='+';
  newChip.onmouseover=()=>{newChip.style.borderColor='var(--ac)';newChip.style.color='#a78bfa';};
  newChip.onmouseout=()=>{newChip.style.borderColor='var(--b2)';newChip.style.color='var(--sx)';};
  newChip.onclick=()=>newTemplate();
  g.appendChild(newChip);

  grid.appendChild(g);
}

// ═══════════════════════════════════════════════
// BUILT-IN ANIMATED TEMPLATES
// ═══════════════════════════════════════════════
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];}

const TMPLS=[
  {id:'portal',name:'Portal',icon:'🌀',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const cx=x-5.5,cy=y-8.5,dist=Math.sqrt(cx*cx+cy*cy),angle=Math.atan2(cy,cx)+f*.08;const s2=Math.sin(angle*3+dist*1.5-f*.1)*.5+.5,fl=.7+.3*Math.sin(f*.15+dist*.8+x*.3);sp(x,y,Math.round((50+100*s2)*fl),Math.round((5+15*s2)*fl),Math.round((120+135*s2)*fl),255,cpx());}}},
  {id:'lava',name:'Lava',icon:'🌋',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const n=Math.sin(x*.7+f*.06)*Math.cos(y*.5-f*.04)+Math.sin((x+y)*.4+f*.05)*.5,t=(n+1.5)/3,bb=Math.sin(x*1.3+f*.07)*Math.sin(y*1.1+f*.09)>.8?1.35:1;sp(x,y,Math.min(255,Math.round((200+55*t)*bb)),Math.min(255,Math.round((50+100*t*t)*bb)),5,255,cpx());}}},
  {id:'soulblue',name:'Soul Blue',icon:'💙',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const fl=Math.sin(x*.9+f*.12+y*.3)*Math.cos(f*.07+x*.5)*.3+Math.sin(x*.6+f*.08)*.4,t=Math.max(0,Math.min(1,1-(y-1)/15+fl));sp(x,y,Math.round(10+40*t),Math.round(80+120*t*t),Math.round(100+155*t),255,cpx());}}},
  {id:'soulred',name:'Soul Red',icon:'🔴',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const fl=Math.sin(x*.9+f*.12+y*.3)*Math.cos(f*.07+x*.5)*.3+Math.sin(x*.6+f*.08)*.4,t=Math.max(0,Math.min(1,1-(y-1)/15+fl));sp(x,y,Math.min(255,Math.round(180+75*t)),Math.round(30+100*t*t),5,255,cpx());}}},
  {id:'stars',name:'Stars',icon:'⭐',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++)sp(x,y,4,4,18,255,cpx());const ss=[[2,2],[4,5],[7,3],[3,9],[8,7],[5,13],[1,14],[9,11],[6,1],[3,15],[8,4],[2,12],[5,6],[7,15],[4,10],[9,2],[1,8],[6,14],[3,4],[8,12]];ss.forEach(([sx2,sy2],i)=>{const tw=.3+.7*(Math.sin(f*.08+i*1.3)*.5+.5);const v=Math.round(200*tw+55);i%3===0?sp(sx2,sy2,v,Math.round(v*.85),Math.round(v*.4),255,cpx()):i%3===1?sp(sx2,sy2,v,v,v,255,cpx()):sp(sx2,sy2,Math.round(v*.6),Math.round(v*.8),v,255,cpx());});}},
  {id:'ocean',name:'Ocean',icon:'🌊',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const w1=Math.sin(x*.8+f*.07)*Math.cos(y*.3+f*.04),w2=Math.cos(x*.5-f*.05)*Math.sin(y*.6+f*.06),c=(w1+w2)*.5,d=(y-1)/15,foam=c>.7&&d<.3?1:0;sp(x,y,Math.min(255,Math.round(10+15*c+10*d)+foam*120),Math.min(255,Math.round(60+40*c-20*d)+foam*110),Math.min(255,Math.round(150+60*c-30*d)+foam*80),255,cpx());}}},
  {id:'galaxy',name:'Galaxy',icon:'🌌',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const cx=x-5.5,cy=y-8.5,dist=Math.sqrt(cx*cx+cy*cy),angle=Math.atan2(cy,cx)+f*.02*(1/(dist+.5));const spiral=Math.sin(angle*2+dist*1.2)*.5+.5,glow=Math.exp(-dist*.3);sp(x,y,Math.min(255,Math.round(20+100*glow+60*spiral*glow)),Math.min(255,Math.round(5+30*glow+40*spiral*glow)),Math.min(255,Math.round(40+150*glow+80*spiral)),255,cpx());}}},
  {id:'rainbow',name:'Rainbow',icon:'🌈',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const[r,g,b]=hsl((x/10+y/16+f*.02)*360,100,55);sp(x,y,r,g,b,255,cpx());}}},
  {id:'lightning',name:'Thunder',icon:'⚡',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++)sp(x,y,4,4,14,255,cpx());const bolt=Math.floor(f/8)%8;let bx=5+Math.round(Math.sin(bolt*1.7)*2);const path=[];for(let y=1;y<=16;y++){bx=Math.max(1,Math.min(10,bx+Math.round(Math.sin(y*.8+bolt)*1.5)));path.push(bx);}for(let y=1;y<=16;y++){const b2=path[y-1],br=.5+.5*Math.sin(f*.3+y*.2),rv=Math.round(180+75*br);sp(b2,y,rv,rv,255,255,cpx());if(b2>1)sp(b2-1,y,Math.round(rv*.3),Math.round(rv*.3),100,255,cpx());if(b2<10)sp(b2+1,y,Math.round(rv*.3),Math.round(rv*.3),100,255,cpx());}}},
  {id:'aurora',name:'Aurora',icon:'🎆',fn(f){for(let y=1;y<=16;y++)for(let x=1;x<=10;x++){const wave=Math.sin(x*.6+f*.04)*3,dy=y-8+wave,curtain=Math.exp(-dy*dy*.04);const[r,g,b]=hsl((x*30+f*.5)%360,90,40);sp(x,y,Math.round(r*curtain+4),Math.round(g*curtain+8),Math.round(b*curtain+14),255,cpx());}}},
];

let animActive=false;
function activateAnim(id){stopAnim();const t=TMPLS.find(x=>x.id===id);if(!t)return;animFn=t.fn;animActive=true;document.querySelectorAll('.tmpl').forEach(b=>b.classList.remove('on'));document.getElementById('tmpl_'+id).classList.add('on');document.getElementById('abadge').classList.add('on');}
function stopAnim(){animFn=null;animActive=false;document.querySelectorAll('.tmpl').forEach(b=>b.classList.remove('on'));document.getElementById('abadge').classList.remove('on');}

function buildTemplates(){
  const grid=document.getElementById('tgrid');
  TMPLS.forEach(t=>{
    const btn=document.createElement('button');btn.className='tmpl';btn.id='tmpl_'+t.id;
    const pvDiv=document.createElement('div');pvDiv.className='tpv';
    const pvc=document.createElement('canvas');pvc.width=10;pvc.height=16;pvc.id='tpvc_'+t.id;
    pvDiv.appendChild(pvc);
    const nm=document.createElement('span');nm.textContent=t.icon+' '+t.name;nm.style.fontSize='7px';
    btn.appendChild(pvDiv);btn.appendChild(nm);btn.onclick=()=>activateAnim(t.id);
    grid.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════
// STEVE 2D PREVIEW
// ═══════════════════════════════════════════════
function shadeHex(hex,amt){const[r,g,b]=h2r(hex);return r2h(Math.max(0,Math.min(255,r+amt)),Math.max(0,Math.min(255,g+amt)),Math.max(0,Math.min(255,b+amt)));}

function drawSteve(){
  scx.clearRect(0,0,SW,SH);
  const bg=scx.createLinearGradient(0,0,0,SH);bg.addColorStop(0,'#0b0918');bg.addColorStop(1,'#060610');scx.fillStyle=bg;scx.fillRect(0,0,SW,SH);
  const gl=scx.createRadialGradient(SW/2,SH*.25,0,SW/2,SH*.25,110);gl.addColorStop(0,'rgba(124,58,237,.1)');gl.addColorStop(1,'transparent');scx.fillStyle=gl;scx.fillRect(0,0,SW,SH);

  const P=7,ox=Math.round(SW/2),oy=16;
  const R=(x,y,w,h,col)=>{scx.fillStyle=col;scx.fillRect(ox+x*P,oy+y*P,w*P,h*P);};
  const shade=(hex,a)=>shadeHex(hex,a);

  // Shadow
  const sg=scx.createRadialGradient(ox,oy+33*P+6,0,ox,oy+33*P+6,50);sg.addColorStop(0,'rgba(0,0,0,.6)');sg.addColorStop(1,'transparent');scx.fillStyle=sg;scx.fillRect(ox-55,oy+33*P,110,16);

  // LEGS
  R(-4,20,4,12,shade(skin.pants,-22));R(0,20,4,12,skin.pants);
  R(-4,31,4,1,skin.shoes);R(0,31,4,1,skin.shoes);
  scx.fillStyle='rgba(0,0,0,.2)';scx.fillRect(ox,oy+20*P,2,12*P);

  // BODY
  R(-4,8,8,12,shade(skin.shirt,-38));
  scx.fillStyle='rgba(0,0,0,.15)';scx.fillRect(ox-4*P,oy+8*P,P,12*P);scx.fillRect(ox+3*P,oy+8*P,P,12*P);
  R(-4,19,8,1,shade('#5c2d00',-10));R(-1,19,2,1,'#9b6c3a');

  // ARMS
  const sw=Math.sin(gf*.04)*.9;
  R(-8,8+sw,4,12,shade(skin.shirt,-30));R(4,8-sw,4,12,shade(skin.shirt,-30));
  scx.fillStyle='rgba(0,0,0,.15)';scx.fillRect(ox-8*P,oy+(8+sw)*P,P,12*P);scx.fillRect(ox+7*P,oy+(8-sw)*P,P,12*P);
  R(-8,(8+sw)+10,4,2,skin.skin);R(4,(8-sw)+10,4,2,skin.skin);

  // HEAD
  R(-4,0,8,8,skin.hair);
  scx.fillStyle='rgba(0,0,0,.16)';for(let i=0;i<8;i+=2)scx.fillRect(ox-4*P,oy+i*P,8*P,P);
  R(-4,2,1,4,shade(skin.skin,-18));R(3,2,1,4,shade(skin.skin,-18));

  // CAPE
  drawCape(ox,oy,P);
}

function drawCape(ox,oy,P){
  const t=gf*.05,capeTopY=oy+8*P+1,capeH=13*P;
  const buf=cpx();
  for(let row=0;row<16;row++){
    const v=row/15,wX=Math.sin(t+v*3)*4*v,wSk=Math.sin(t*.7+v*2)*2*v;
    for(let col=0;col<10;col++){
      const[r,g,b,a]=gp(col+1,row+1,buf);if(a<10)continue;
      const u=col/9,cw=wX+Math.sin(t*.9+u*2)*1.5*v;
      const sx=ox-5*P+col*P+Math.round(cw+wSk*u);
      const sy=capeTopY+Math.round(row*(capeH/16));
      const lf=(.78+.22*(1-v))*(.85+.15*u);
      scx.fillStyle='rgb('+Math.round(r*lf)+','+Math.round(g*lf)+','+Math.round(b*lf)+')';
      scx.fillRect(sx,sy,P+1,Math.ceil(capeH/16)+1);
    }
  }
  scx.fillStyle='rgba(0,0,0,.22)';scx.fillRect(ox-5*P,capeTopY,10*P,2);
}

// ═══════════════════════════════════════════════
// MASTER LOOP
// ═══════════════════════════════════════════════
let lastTick=0;
function loop(ts){
  gf++;
  // Playback
  if(playing&&frames.length>1){
    if(ts-lastTick>1000/fps){lastTick=ts;curFrame=(curFrame+1)%frames.length;render2d();refreshStrip();document.getElementById('framectr').textContent=(curFrame+1)+' / '+frames.length;}
  }
  // Animated template
  if(animFn){animFn(gf);render2d();updateThumb(curFrame);}
  // Mini previews
  if(gf%3===0){
    TMPLS.forEach(t=>{
      const c=document.getElementById('tpvc_'+t.id);if(!c)return;
      const tmpBuf=new Uint8ClampedArray(CW*CH*4);
      const o=frames,oc=curFrame;frames=[tmpBuf];curFrame=0;t.fn(gf);frames=o;curFrame=oc;
      const tmp2=new Uint8ClampedArray(10*16*4);
      for(let y=0;y<16;y++)for(let x=0;x<10;x++){const src=idx(x+1,y+1),dst=(y*10+x)*4;tmp2[dst]=tmpBuf[src];tmp2[dst+1]=tmpBuf[src+1];tmp2[dst+2]=tmpBuf[src+2];tmp2[dst+3]=255;}
      c.getContext('2d').putImageData(new ImageData(tmp2,10,16),0,0);
    });
  }
  drawSteve();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.ctrlKey||e.metaKey){
    if(e.key==='z'){e.preventDefault();undo();}
    if(e.key==='y'){e.preventDefault();redo();}
    if(e.key==='s'){e.preventDefault();saveCurrent();}
  }else{
    const m={b:'draw',e:'erase',f:'fill',i:'pick'};
    if(m[e.key]){const btn=document.querySelector('[data-t="'+m[e.key]+'"]');if(btn)setTool(btn);}
    if(e.key==='Escape'){stopAnim();closeModal();closeRenameModal();}
    if(e.key===' '){e.preventDefault();togglePlay();}
    if(e.key==='ArrowLeft'){e.preventDefault();prevFrame();}
    if(e.key==='ArrowRight'){e.preventDefault();nextFrame();}
  }
});
document.getElementById('tplNameInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmSave();if(e.key==='Escape')closeModal();});
document.getElementById('renameInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmRename();if(e.key==='Escape')closeRenameModal();});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
setColor('#8b5cf6');
buildPal();
buildTemplates();
buildPresets();
refreshSkinUI();
buildCustomGrid();
resize();
buildStrip();
requestAnimationFrame(loop);
